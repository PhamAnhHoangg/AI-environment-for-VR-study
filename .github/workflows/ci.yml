name: checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      # The heavy packages (torch, whisper, gradio) are not installed, and the Unity C# code needs the
      # Unity editor, so neither is run here. These checks need only the standard library and ruff.
      - name: Python files compile
        run: python -m compileall -q .
      - name: Lint for real errors (syntax, undefined names, unused variables)
        run: |
          pip install ruff
          ruff check --select E9,F63,F7,F82,F841 .
      - name: Tests (room config, colour rules, settings)
        run: python -m unittest discover -s tests -v
